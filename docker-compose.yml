# Local stack only. Production runs on Cloud Run, see deploy/cloudrun.
services:
  limesurvey:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - mariadb
    volumes:
      # Only survey uploads are mutable. Themes and plugins come from the image, like on Cloud Run.
      - limesurvey_surveys:/var/www/html/upload/surveys
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=limesurvey
      - DB_USERNAME=limesurvey
      - DB_PASSWORD=limesurvey
      - SERVER_NAME=localhost
      # Local-only keys. Production keys live in Secret Manager.
      - ENCRYPTION_NONCE=8819af4d950b25d430d6713c7975e1f03a3e13bf50366693
      - ENCRYPTION_SECRETBOX_KEY=90c7667215cda04ce0e49c1f85c2307fe1c4abeddac37a7fb6348801c037904c

  mariadb:
    image: mariadb:11.4.2
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=limesurvey
      - MYSQL_USER=limesurvey
      - MYSQL_PASSWORD=limesurvey
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
  limesurvey_surveys:
